<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDIT.mp4</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .player {
    position: relative;
    max-width: 100vw;
    max-height: 100vh;
  }
  video {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
  }
  .hint {
    position: absolute;
    bottom: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    font-family: sans-serif;
    font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    pointer-events: none;
  }
  .hint svg {
    width: 26px;
    height: 26px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.8));
  }
  #hint-audio { right: 84px; }
  #hint-fullscreen { right: 14px; }
  .hint span {
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="player">
    <video id="vid" src="https://media.githubusercontent.com/media/gshetty1978-ctrl/Download/main/EDIT.mp4" controls playsinline></video>
    <div class="hint" id="hint-audio">
      <span>Unmute</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v16" stroke-linecap="round"/><path d="M5 13l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="hint" id="hint-fullscreen">
      <span>Fullscreen</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v16" stroke-linecap="round"/><path d="M5 13l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <script>
    var vid = document.getElementById('vid');
    var hints = document.querySelectorAll('.hint');
    vid.addEventListener('play', function () {
      hints.forEach(function (h) { h.style.display = 'none'; });
    }, { once: true });
  </script>
</body>
</html>
