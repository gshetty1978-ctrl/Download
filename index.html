<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDIT.mp4</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  video {
    max-width: 100vw;
    max-height: 100vh;
    transition: filter .3s ease;
  }
  video.blurred {
    filter: blur(10px);
  }
  .notice {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.35);
    padding: 24px;
    box-sizing: border-box;
  }
  .notice-box {
    max-width: 380px;
    text-align: center;
    color: #fff;
    font-family: sans-serif;
  }
  .notice-box p {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
    margin: 0 0 20px;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  .notice-box button {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    color: #111;
    background: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <video id="vid" src="https://media.githubusercontent.com/media/gshetty1978-ctrl/Download/main/EDIT.mp4" controls playsinline class="blurred"></video>

  <div class="notice" id="notice">
    <div class="notice-box">
      <p>Please Turn On Fullscreen Mode And Unmute Before Watching For Best Watching Experience</p>
      <button id="dismiss">Got it</button>
    </div>
  </div>

  <script>
    var vid = document.getElementById('vid');
    var notice = document.getElementById('notice');
    var dismiss = document.getElementById('dismiss');

    function closeNotice() {
      notice.remove();
      vid.classList.remove('blurred');
    }

    dismiss.addEventListener('click', closeNotice);
    vid.addEventListener('play', closeNotice, { once: true });
  </script>
</body>
</html>
